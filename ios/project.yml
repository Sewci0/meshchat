# XcodeGen spec: `brew install xcodegen && xcodegen` writes MeshChat.xcodeproj (not committed).
name: MeshChat
options:
  bundleIdPrefix: io.github.sewci0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MeshChatKit:
    path: .
  # the map (MapLibre Native, BSD licence): vector tiles, offline regions
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0
targets:
  MeshChat:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: MeshChatKit
        product: MeshChatUI
      # draws the radio's status on the lock screen (Live Activity)
      - target: MeshChatWidgets
      - package: MapLibre
        product: MapLibre
    # Communication Notifications: messages show the sender's picture and can break through Focus
    entitlements:
      path: App/MeshChat.entitlements
      properties:
        com.apple.developer.usernotifications.communication: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MeshChat
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # keeps the radio connected in the background, so messages keep arriving: Bluetooth on its own;
        # WiFi through coarse location updates (the only background mode a LAN link can use)
        UIBackgroundModes: [bluetooth-central, location]
        # Communication Notifications: incoming messages donated as INSendMessageIntent (sender pictures)
        NSUserActivityTypes: [INSendMessageIntent]
        # the radio's status on the lock screen, in the Dynamic Island and on the always-on display
        NSSupportsLiveActivities: true
        NSBluetoothAlwaysUsageDescription: MeshChat connects to your MeshCore radio over Bluetooth to send and receive messages.
        NSLocalNetworkUsageDescription: MeshChat connects to MeshCore radios on your WiFi network.
        NSBonjourServices: [_http._tcp]
        NSCameraUsageDescription: MeshChat reads MeshCore QR codes to add contacts and channels.
        NSLocationWhenInUseUsageDescription: "MeshChat uses your location to keep a WiFi radio connected while the app is in the background, and, if you choose, to centre the map or set your node's position. Your position is sent only if you share it on the mesh."
        ITSAppUsesNonExemptEncryption: false
        # meshcore:// contact and channel links (QR codes from the MeshCore apps) open here
        CFBundleURLTypes:
          - CFBundleURLName: io.github.sewci0.meshchat
            CFBundleURLSchemes: [meshcore]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sewci0.meshchat
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: true
        DEAD_CODE_STRIPPING: true
  # The radio's status as a Live Activity (lock screen, Dynamic Island, always-on display). The app keeps
  # it current; this only draws it.
  MeshChatWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: MeshChat
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sewci0.meshchat.widgets
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: true
        DEAD_CODE_STRIPPING: true
        SKIP_INSTALL: true
