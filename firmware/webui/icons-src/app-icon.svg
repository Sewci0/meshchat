<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- MeshChat app icon. Full-bleed square (iOS rounds the corners itself); the artwork stays
       inside the central 80% so it also works as a maskable icon. Render: see README. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26ad74"/>
      <stop offset="1" stop-color="#17855a"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- chat bubble -->
  <path fill="#fff" d="M352 262h320c66 0 120 54 120 120v220c0 66-54 120-120 120H470l-128 92c-14 10-33 0-33-17v-79c-43-18-77-61-77-116V382c0-66 54-120 120-120z"/>
  <!-- three mesh nodes and their links -->
  <g stroke="#1a8f5f" stroke-width="30" stroke-linecap="round">
    <line x1="392" y1="568" x2="512" y2="412"/>
    <line x1="512" y1="412" x2="632" y2="568"/>
    <line x1="392" y1="568" x2="632" y2="568"/>
  </g>
  <g fill="#1a8f5f">
    <circle cx="512" cy="412" r="52"/>
    <circle cx="392" cy="568" r="52"/>
    <circle cx="632" cy="568" r="52"/>
  </g>
</svg>
