; MeshChat build: official companion firmware for the XIAO ESP32-S3 + Wio-SX1262, with USB *and*
; WiFi (TCP 5000) at the same time, plus runtime WiFi setup (hotspot + page) and an mDNS hostname.
; No WIFI_DEBUG_LOGGING: it prints on Serial, which is also the USB companion link.
[env:Xiao_S3_WIO_companion_radio_usb_wifi]
extends = Xiao_S3_WIO
build_flags =
  ${Xiao_S3_WIO.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_USB_INTERFACE
  -D ENABLE_WIFI_INTERFACE
  -D WIFI_PORTAL
  -D TCP_PORT=5000
  ; source paths compiled into log messages: your home folder becomes ~ (no user name in the binary)
  -fmacro-prefix-map=${sysenv.HOME}=~
  -ffile-prefix-map=${sysenv.HOME}=~
build_src_filter = ${Xiao_S3_WIO.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/esp32/*.cpp>
  +<helpers/wifi/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Xiao_S3_WIO.lib_deps}
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit SSD1306 @ ^2.5.13

; MeshChat on the radio: everything above, plus Bluetooth, plus the web UI served from the radio
; itself (http://<hostname>.local) with message history kept on the node.
[env:Xiao_S3_WIO_companion_radio_meshchat]
extends = env:Xiao_S3_WIO_companion_radio_usb_wifi
build_flags =
  ${env:Xiao_S3_WIO_companion_radio_usb_wifi.build_flags}
  -D BLE_PIN_CODE=123456
  -D WEB_UI
  -D MESH_IN_PSRAM
  -D MAX_INTERFACES=5
  ; the map's home: set it in MeshChat (Settings → Map), where it's saved on the radio. To build it in
  ; instead, add -D WEBUI_HOME_LAT=<lat> and -D WEBUI_HOME_LON=<lon> (degrees).
lib_deps =
  ${env:Xiao_S3_WIO_companion_radio_usb_wifi.lib_deps}
  ESP32Async/AsyncTCP @ 3.5.0
  ESP32Async/ESPAsyncWebServer @ 3.10.3
  bblanchon/ArduinoJson @ 7.2.2
